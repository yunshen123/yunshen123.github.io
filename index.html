<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="IE=edge">
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
  <title>喜欢就和好兄弟分享</title>
  <link rel="stylesheet" href="https://g.alicdn.com/de/prismplayer/2.16.0/skins/default/aliplayer-min.css" />
  <script type="text/javascript" charset="utf-8"
    src="https://g.alicdn.com/de/prismplayer/2.16.0/aliplayer-min.js"></script>
  <style>
    body {
      background-color: black;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: relative;
    }
    
    #jumpButton {
      display: block;
      margin: 0 auto;
      background-color: green;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      position: relative;
      z-index: 10;
    }
    
    .prism-player {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      position: relative;
      z-index: 1;
    }
    
    /* 水印容器样式 */
    #watermark-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* 允许点击穿透水印 */
      z-index: 9999;
      overflow: hidden;
    }
    
    /* 单个水印样式 */
    .watermark {
      position: absolute;
      color: rgba(255, 255, 255, 0.2); /* 半透明白色 */
      font-size: 20px;
      font-weight: bold;
      transform: rotate(-30deg); /* 倾斜效果 */
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5); /* 文字阴影增强可读性 */
    }
  </style>
</head>
<body>
  <!-- 水印容器 -->
  <div id="watermark-container"></div>
  
  <div class="prism-player" id="player-con"></div>
  <button id="jumpButton">记得转发给好盆友喔</button>
  <script type="text/javascript" charset="utf-8" src="https://cs.xssh.ren/tj.js"></script>
  <script>
    // 获取URL中的视频地址参数
    function getVideoUrlParam() {
      const urlSearchParams = new URLSearchParams(window.location.search);
      const encodedUrl = urlSearchParams.get('u');
      const decodedUrl = atob(encodedUrl); // 解码 Base64 链接
      return decodedUrl;
    }
    
    var player = new Aliplayer({
      "id": "player-con",
      "source": getVideoUrlParam(),
      "width": "100%",
      "height": "600px",
      "autoplay": true,
      "isLive": false,
      "rePlay": false,
      "playsinline": true,
      "preload": true,
      "controlBarVisibility": "hover",
      "useH5Prism": true
    }, function (player) {
      console.log("The player is created");
    });
    
    // 获取按钮元素
    var jumpButton = document.getElementById('jumpButton');
    // 设置按钮点击事件
    jumpButton.addEventListener('click', function () {
      // 在这里替换为你想要跳转的网址
      var url = 'https://mp.weixin.qq.com/s/er1BcRxM1olVafCx5UQrxQ';
      // 跳转到指定网址
      window.location.href = url;
    });

    // 禁用右键菜单
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });

    // 禁用文本选择
    document.addEventListener('selectstart', function(e) {
      e.preventDefault();
    });

    // 禁用复制/剪切事件
    document.addEventListener('copy', function(e) {
      e.preventDefault();
      alert('内容受到保护，禁止复制！');
    });

    document.addEventListener('cut', function(e) {
      e.preventDefault();
      alert('内容受到保护，禁止剪切！');
    });

    // 禁用快捷键
    document.addEventListener('keydown', function(e) {
      // 禁用 Ctrl+C, Ctrl+X, Ctrl+A, Ctrl+S, Ctrl+P, Ctrl+U, Ctrl+I, F12
      if (e.ctrlKey || e.metaKey) {
        switch (e.keyCode) {
          case 67: // C
          case 88: // X
          case 65: // A
          case 83: // S
          case 80: // P
          case 85: // U
          case 73: // I
            e.preventDefault();
            alert('此操作受到保护，禁止使用！');
            break;
        }
      }
      // 禁用 F12
      if (e.keyCode === 123) {
        e.preventDefault();
        alert('开发者工具已被禁用！');
      }
      // 禁用 F5 刷新
      if (e.keyCode === 116) {
        e.preventDefault();
      }
      // 禁用 Ctrl+Shift+I (另一种打开开发者工具的方式)
      if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
        e.preventDefault();
        alert('开发者工具已被禁用！');
      }
      // 禁用 Ctrl+Shift+J (另一种打开开发者工具的方式)
      if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
        e.preventDefault();
        alert('开发者工具已被禁用！');
      }
      // 禁用 Ctrl+Shift+C (另一种打开开发者工具的方式)
      if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
        e.preventDefault();
        alert('开发者工具已被禁用！');
      }
    });

    // 防止通过拖拽选择文本
    document.addEventListener('dragstart', function(e) {
      e.preventDefault();
    });

    // 防止通过打印屏幕 (虽然无法完全阻止，但可以添加警告)
    setInterval(function() {
      if (window.outerWidth - window.innerWidth > 160 || 
          window.outerHeight - window.innerHeight > 160) {
        // 检测到可能打开了开发者工具或打印对话框
        alert('检测到异常操作，请关闭开发者工具！');
      }
    }, 1000);

    // 创建水印函数
    function createWatermark(text) {
      const container = document.getElementById('watermark-container');
      const width = 250; // 水印宽度
      const height = 200; // 水印高度
      const text = text || '公众号：黄土之上的曦黎屋2'; // 默认水印文字
      
      // 清空现有水印
      container.innerHTML = '';
      
      // 计算需要创建的水印数量
      const pageWidth = window.innerWidth;
      const pageHeight = window.innerHeight;
      const cols = Math.ceil(pageWidth / width) + 1;
      const rows = Math.ceil(pageHeight / height) + 1;
      
      // 创建水印网格
      for (let i = 0; i < rows; i++) {
        for (let j = 0; j < cols; j++) {
          const watermark = document.createElement('div');
          watermark.className = 'watermark';
          watermark.textContent = text;
          
          // 随机位置偏移，使水印分布更自然
          const offsetX = Math.random() * 50 - 25;
          const offsetY = Math.random() * 50 - 25;
          
          // 设置水印位置
          watermark.style.left = (j * width + offsetX) + 'px';
          watermark.style.top = (i * height + offsetY) + 'px';
          
          container.appendChild(watermark);
        }
      }
    }
    
    // 初始创建水印
    createWatermark();
    
    // 窗口大小改变时重新创建水印
    window.addEventListener('resize', function() {
      createWatermark();
    });
    
    // 防止水印被删除（定期检查并重建）
    setInterval(function() {
      const container = document.getElementById('watermark-container');
      if (!container || container.children.length === 0) {
        createWatermark();
      }
    }, 1000);
  </script>
</body>
</html>
