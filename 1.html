<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>11.05🍉合集</title>
  <link href="https://web.sdk.qcloud.com/player/tcplayer/release/v4.2.1/tcplayer.min.css" rel="stylesheet" />
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.2.1/libs/hls.min.0.13.2m.js"></script>
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.5.0/tcplayer.v4.5.0.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #e0f7ff, #ffffff);
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #111;
      margin-bottom: 30px;
    }

    .video-block {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      padding: 15px;
      margin-bottom: 30px;
    }

    .video-title {
      display: block;
      background: #0094ff;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      text-align: left; /* 修改为靠左对齐 */
    }

    .video-title:hover {
      background: #0079cc;
    }

    .tcplayer-container {
      display: none;
      width: 100%;
      height: 580px;
      max-width: 1080px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
    }

    .jump-btn {
      display: none;
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #ff6a00;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .jump-btn:hover {
      background-color: #e85c00;
    }
  </style>
</head>
<body>
  <h1>11.05🍉合集</h1>
  <div id="content">加载中...</div>

  <script>
    const players = [];
    let currentPlayingIndex = null;

    function getLocalData() {
      return {
        data_mp4: [
          { title: "吃🍉户外车震！粤N8K366车主你车震的事藏不住了！", url: "http://aod.cos.tx.xmcdn.com/storages/b3e6-audiofreehighqps/FD/AF/GAqh9sAM4M0hACAAAAQweE06.mp4" },
          { title: "吃🍉兄弟们，这是真🐔🎱还是假🐔🎱？", url: "http://aod.cos.tx.xmcdn.com/storages/7e6f-audiofreehighqps/F3/4F/GKwRIW4M4M25ACAAAAQweIqM.mp4" },
          { title: "吃🍉日电动车 神人！我就蹭蹭不进去！", url: "http://aod.cos.tx.xmcdn.com/storages/f3d1-audiofreehighqps/56/A0/GKwRIasM4M5OABVQEwQweObn.mp4" },
          { title: "吃🍉探店 #站街女 这身材可以啊，", url: "http://aod.cos.tx.xmcdn.com/storages/e532-audiofreehighqps/DA/C2/GAqhg3wM4M6jACAAAAQweSel.mp4" },
          { title: "吃🍉表演太卖力了， 你看把大哥整的都迷糊了", url: "http://aod.cos.tx.xmcdn.com/storages/0106-audiofreehighqps/C4/0A/GKwRIJIM4M7_ACAAAAQweV3x.mp4" },
          { title: "吃🍉咬到 静脉 了 #狗咬人 哈尼 受伤 ！", url: "http://aod.cos.tx.xmcdn.com/storages/91c9-audiofreehighqps/C3/A6/GAqhfZkM4M9jAAxjUQQweabD.mp4" },
          { title: "吃🍉缆车 C🖊 🚠 避孕套 装满了 “ 子弹 ", url: "http://aod.cos.tx.xmcdn.com/storages/3a14-audiofreehighqps/4B/02/GKwRIasM4NA6ABrgHQQweigz.mp4" },
          { title: "吃🍉四川 网友发布：亲眼目睹，吓死人了", url: "http://aod.cos.tx.xmcdn.com/storages/5ad4-audiofreehighqps/12/5F/GAqhfZkM4NCTACAAAAQwelPt.mp4" },
          { title: "吃🍉直播 #pk #鞭炮 #炸🖊低俗 ～", url: "http://aod.cos.tx.xmcdn.com/storages/afaa-audiofreehighqps/F9/38/GAqhntAM4NDtACAAAAQweoce.mp4" },
          { title: "吃🍉非洲 对待 #小偷 绝不手软😂 打小偷 ", url: "http://aod.cos.tx.xmcdn.com/storages/f0d6-audiofreehighqps/F6/A2/GAqhVp8M4NFRACAAAAQwesT2.mp4" },
          { title: "吃🍉一个过肩摔 直接干报废", url: "http://aod.cos.tx.xmcdn.com/storages/d914-audiofreehighqps/68/6D/GKwRIasM4NGQACAAAAQweunO.mp4" },
          { title: "吃🍉大兄弟辛苦了为社会服务🌚", url: "http://aod.cos.tx.xmcdn.com/storages/6386-audiofreehighqps/9D/C4/GKwRIMAM4NHlACAAAAQwexuM.mp4" },
        ],
        btn_text: '加入吃瓜微信群',
        btn_link: 'https://mp.weixin.qq.com/s/uGSBdlVlSHMpXLkxdOlHOA',
        title: '转发＝更新的动力'
      };
    }

    async function loadVideos() {
      const data = getLocalData();
      document.title = data.title;

      const container = document.getElementById('content');
      container.innerHTML = '';

      data.data_mp4.forEach((item, index) => {
        const videoId = "tcplayer-container-" + index;
        const block = document.createElement('div');
        block.className = 'video-block';
        block.innerHTML = `
          <span class="video-title" data-index="${index}">${index + 1}. ${item.title}</span>
          <video id="${videoId}" class="tcplayer-container" preload="auto" playsinline webkit-playsinline></video>
          <button class="jump-btn">${data.btn_text}</button>
        `;
        container.appendChild(block);

        const jumpBtn = block.querySelector('.jump-btn');
        jumpBtn.onclick = () => window.location.href = data.btn_link;

        setTimeout(() => {
          const player = TCPlayer(videoId, { reportable: false });
          player.src(item.url);
          player.pause();
          players[index] = player;
        }, 0);
      });

      document.querySelectorAll('.video-title').forEach(titleElem => {
        titleElem.addEventListener('click', function () {
          const index = parseInt(this.getAttribute('data-index'));
          if (currentPlayingIndex === index) return;

          if (currentPlayingIndex !== null) {
            const prevVideoElem = document.getElementById("tcplayer-container-" + currentPlayingIndex);
            if (prevVideoElem) prevVideoElem.style.display = 'none';
            const prevBlock = prevVideoElem?.parentElement;
            prevBlock?.querySelector('.jump-btn')?.style.setProperty('display', 'none');
            players[currentPlayingIndex]?.pause();
          }

          const currentVideoElem = document.getElementById("tcplayer-container-" + index);
          currentVideoElem.style.display = 'block';
          const currentBlock = this.parentElement;
          currentBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
          currentBlock.querySelector('.jump-btn').style.display = 'block';
          players[index]?.play();
          currentPlayingIndex = index;
        });
      });
    }

    loadVideos();
  </script>
</body>
    <head>
    <meta charset="UTF-8">
    <title>防调试示例</title>
    <script>
        // 1. 禁用右键菜单
        document.oncontextmenu = function () {
            return false;
        };

        // 2. 禁用 F12、Ctrl+Shift+I、Ctrl+Shift+J、Ctrl+U 等快捷键
        document.onkeydown = function (e) {
            if (
                e.keyCode === 123 || // F12
                (e.ctrlKey && e.shiftKey && e.keyCode === 73) || // Ctrl+Shift+I
                (e.ctrlKey && e.shiftKey && e.keyCode === 74) || // Ctrl+Shift+J
                (e.ctrlKey && e.keyCode === 85) // Ctrl+U (查看源代码)
            ) {
                return false;
            }
        };

        // 3. 定时器无限 debugger（当用户打开开发者工具时，页面会卡死在断点处）
        setInterval(function () {
            (function () {
                return false;
            }
            ["constructor"]("debugger")
            ["call"]());
        }, 50);
    </script>
</head>
</html>
