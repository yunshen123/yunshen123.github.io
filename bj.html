<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👗欢迎加入曦黎屋🍉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
            color: #333;
        }

        /* 移动端卡片容器 */
        .card-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 20px;
        }

        /* 头部标题样式 */
        .header {
            display: flex;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #222;
            margin-bottom: 16px;
        }

        .header .icon {
            margin-right: 6px;
        }

        /* 文本段落 */
        .text-content {
            font-size: 14px;
            line-height: 1.6;
            color: #444;
            margin-bottom: 16px;
        }

        /* 深色块（如展示代码、特别提醒或主图背景） */
        .highlight-block {
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .highlight-block img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin: 10px 0;
        }

        /* 标注框（类似中间粉色/亮色信息提示区） */
        .info-box {
            background-color: #fff0f5;
            border-left: 4px solid #ff4d4f;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #d9363e;
            margin-bottom: 16px;
        }

        /* 二维码/大图展示区 */
        .image-box {
            text-align: center;
            margin-top: 10px;
        }

        .image-box img {
            max-width: 80%;
            height: auto;
            border-radius: 8px;
        }

        .caption {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- 头部标题 -->
        <div class="header">
            <span class="icon">🍉</span> 微信乐子屋 ☀️
        </div>

        <!-- 顶部普通文字 -->
        <div class="text-content">
            19赞赏年费，28永久，日更稳定
        </div>

        <!-- 深色背景区：包含文字与图片 -->
        <div class="highlight-block">
            <p style="font-size: 13px; margin-bottom: 8px;">扫一扫下图赞赏</p>
            <!-- 替换 src 里的图片链接 -->
            <img src="https://p.iqun.qq.com/web/msg/2026821/51f2b0b0-50cd-486a-bb63-67a3feecb60e-1787303677388.png" alt="插图">
            <p style="font-size: 12px; opacity: 0.8;">“赞赏之后再加客服，否则不通过”</p>
        </div>

        <!-- 提示高亮框 -->
        <div class="info-box">
            📢 重点提示：进群保持安静，等待更新即可
        </div>

        <!-- 二维码/主图放置区 -->
        <div class="image-box">
            <!-- 替换 src 里的二维码或主图链接 -->
            <img src="https://p.iqun.qq.com/web/msg/2026821/9920c501-c3a6-4f5e-8b35-907b91f55213-1787303714551.png" alt="二维码展示">
            <div class="caption">长按识别添加客服</div>
        </div>
    </div>

</body>
</html>
